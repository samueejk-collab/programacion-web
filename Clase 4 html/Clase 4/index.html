<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <header>
        <h1>PIZZERIA ETEC</h1>
        <p>Inicie su pedido online</p>
    </header>
    <main>
      <form action="">
        <section>
        <h2> Datos del Cliente</h2>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre"/>   

        <label for="Telefono">Telefono</label>
        <input type="text" id="Telefono" name="telefono"/>  

        <label for="Email">Email</label>
        <input type="text" id="Email" name="Email"/>    

        <label for="Direccion">Direccion</label>
        <input type="text" id="Direccion" name="Direccion"/>  
        </section>  
        <section>
            <h3>Tamaño</h3>
            <input type="radio" id="chica" name="tamaño" value="chica"/>  
            <label for="chica">Chica</label>
            <input type="radio" id="grande" name="tamaño" value="grande"/>  
            <label for="grande">Grande</label>
        </section>
        <section>
            <h2>Ingredientes</h2>
            <label for="jamon">Jamon</label>
            <input type="checkbox" id="jamon" name="ingrediente_jamon" value="jamon">

            <label for="Queso">Queso</label>
            <input type="checkbox" id="Queso" name="ingrediente_queso" value="queso">
        </section> 
        <section>
            <label for="masa">Tipo de Masa</label>
            <select name="masa" id="masa">
              <option value="Delgada">Delgada</option>
             <option value="Mediano">Mediano</option>
             <option value="Integral">Integral</option>
            </select>
        <h2>Comentarios</h2>
        <textarea name="comentarios" id="comentarios" rows="4" cols="30"></textarea>  
        <button type="submit">ENVIAR PEDIDO</button>                           
      </form>
    </main>
<!--required tira error si no se completa-->    
    
</body>
</html>
