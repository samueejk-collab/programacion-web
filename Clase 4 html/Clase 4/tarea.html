<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header> 
        <h1> Libreria ETEC </h1>
        <p>Inicie su pedido Online</p>

    </header>
    <main>
        <form action="">
        <section>
           <h2> Datos del Cliente</h2>
           <label for="nombre">Nombre</label>
           <input type="text" id="nombre" name="nombre"/>   
           <label for="Telefono">Telefono</label>
           <input type="number" id="Telefono" name="telefono"/>  
           <label for="Email">Email</label>
           <input type="email" id="Email" name="Email"/>    
           <label for="Buscador">Buscador</label>
           <input type="search" id="Buscador" name="Buscador"/>  
        </section> 
        <section>
          <h2>Generos</h2>
            <label for="terror">Terror</label>
            <input type="checkbox" id="terror" name="genero_terror" value="terror">

            <label for="Romance">Romance</label>
            <input type="checkbox" id="Romance" name="genero_Romance" value="romance">

            <label for="Biografico">Biografico</label>
            <input type="checkbox" id="Biografico" name="genero_Biografico" value="Biografico">
        
            <label for="Comedia">Comedia</label>
            <input type="checkbox" id="Comedia" name="genero_Comedia" value="Comedia">
        
        </section>
        <section>
          <h2>Formato</h2>
            <label for="Tapa Dura">Tapa Dura</label>
            <input type="checkbox" id="Tapa Dura" name="Tapa Dura" value="Tapa Dura">

            <label for="Tapa Blanda">Tapa Blanda</label>
            <input type="checkbox" id="Tapa Blanda" name="Tapa Blanda" value="Tapa Blanda">
        </section>
         <h2>Comentarios</h2>
        <textarea name="comentarios" id="comentarios" rows="4" cols="30"></textarea>  
        <button type="submit">ENVIAR PEDIDO</button>  
        </form>
    </main>
</body>
</html>
