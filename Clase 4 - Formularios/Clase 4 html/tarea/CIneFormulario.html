<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CINE ETEC - Boletos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Cine ETEC</h1>
     <img src="https://media1.tenor.com/m/LK628grSBnEAAAAC/cat-ai-pufferfish-cat.gif" alt="gatopescao">
    </header>
    <main>
      <form>
        <section>
          <h2>Datos del cliente</h2>
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required />

          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required />
        </section>

        <section>
          <h2>Película</h2>
          <p>Seleccione la película</p>

          <label class="pelicula-opcion">
            <input type="radio" name="pelicula" value="whiplash" required />
            <img src="https://m.media-amazon.com/images/M/MV5BN2NiMjY3OTgtMzVmYi00MjIwLTljOWItY2QzYTdiNTFkMTQyXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Whiplash" width="120" />
            <div class="info">
              <h3>Whiplash</h3>
              
            </div>
          </label>

          <label class="pelicula-opcion">
            <input type="radio" name="pelicula" value="perfect_day" />
            <img src="https://m.media-amazon.com/images/M/MV5BOTY4ZmQ0NDMtOTdhMC00NzcxLThkZTEtYjk1NmU3ODE3MzdhXkEyXkFqcGc@._V1_.jpg" alt="Perfect Day" width="120" />
            <div class="info">
              <h3>Días Perfectos</h3>
              
            </div>
          </label>

          <label class="pelicula-opcion">
            <input type="radio" name="pelicula" value="eterno-resplandor" />
            <img src="https://www.arte.unicen.edu.ar/cdab/wp-content/uploads/2018/11/eterno-resplandor-de-una-mente-sin-recuerdos.jpg" alt="Eterno Resplandor" width="120" />
            <div class="info">
              <h3>Eterno Resplandor de una Mente sin Recuerdos</h3>
              
            </div>
          </label>
        </section>

        <section>
          <h2>Horario</h2>

          <label class="horario-opcion">
            <input type="radio" name="horario" value="12" required />
            <span>12:00 Hs</span>
          </label>

          <label class="horario-opcion">
            <input type="radio" name="horario" value="14" />
            <span>14:00 Hs</span>
          </label>

          <label class="horario-opcion">
            <input type="radio" name="horario" value="20" />
            <span>20:00 Hs</span>
          </label>
        </section>

        <section>
          <h2>Opciones</h2>
          <label class="opcion-extra">
            <input type="checkbox" id="3d" name="formato_3d" value="3d" />
            <span>3D</span>
          </label>

          <label class="opcion-extra">
            <input type="checkbox" id="subtitulada" name="formato_subtitulada" value="subtitulada" />
            <span>Subtitulada</span>
          </label>

          <label class="opcion-extra">
            <input type="checkbox" id="vip" name="formato_vip" value="vip" />
            <span>Sala VIP</span>
          </label>
        </section>

        <section>
          <h2>Comentarios</h2>
          
          <textarea id="comentarios" name="comentarios" rows="4" cols="30"></textarea>
        </section>

        <button type="submit">Reservar boletos</button>
      </form>
    </main>
  </body>
</html>
